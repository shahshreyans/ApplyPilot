# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "software engineer"
    tier: 1
  - query: "backend engineer"
    tier: 1
  - query: "backend developer"
    tier: 1
  - query: "full stack developer"
    tier: 2
  - query: "full stack engineer"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "python engineer"
    tier: 2
  - query: "DevOps engineer"
    tier: 2
  - query: "site reliability engineer"
    tier: 2
  - query: "platform engineer"
    tier: 2
  - query: "cloud engineer"
    tier: 2
  - query: "data engineer"
    tier: 2
  - query: "infrastructure engineer"
    tier: 2
  - query: "software developer"
    tier: 3
  - query: "developer"
    tier: 3
  - query: "systems engineer"
    tier: 3
  - query: "automation engineer"
    tier: 3
  - query: "solutions engineer"
    tier: 3
  - query: "integration engineer"
    tier: 3
  - query: "ML engineer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "AI engineer"
    tier: 3
  - query: "security engineer"
    tier: 3

# Locations to search
# Entries with `remote: true` are skipped while location.exclude_remote is on.
# If you re-enable remote, search the country (not "Remote"/"Anywhere"):
# boards like LinkedIn treat "Remote" as worldwide and return mostly US postings.
locations:
  - location: "Regina, SK"
    remote: false

# Location filtering -- accept/reject patterns for job location text.
# Patterns match whole words, ignoring case ("SK" matches "Regina, SK"
# but not "Gdansk").
# Order: exclude_remote -> reject_patterns -> exclude_us -> accept_patterns.
location:
  # Drop every remote / anywhere / work-from-home job, including ones that
  # mention Canada ("Remote - US or Canada") or no country at all ("Remote").
  exclude_remote: true
  # Drop US-based jobs, even if they also match an accept pattern.
  # Defaults to true whenever `country` is not the USA.
  exclude_us: true
  # Drop jobs with no location at all (some Workday postings have none).
  exclude_unknown: true
  # After every discover run, delete jobs in the DB that fail this filter
  # (jobs you already applied to are kept).
  cleanup_after_discover: true
  accept_patterns:
    - "Regina"
    - "Saskatchewan"
    - "Canada"
  reject_patterns:
    - "London, UK"
    - "India"
    - "Philippines"

# Country for Indeed/Glassdoor searches (also used for remote searches)
country: "Canada"

# Discovery sources -- set any to false to skip it during `applypilot run discover`
discovery:
  jobspy: true        # Indeed / LinkedIn / Glassdoor / Google (boards below)
  workday: true       # Company career sites from employers.yaml
  smartextract: true  # AI-powered scraping of sites.yaml (uses LLM calls)
  # Also search for the job titles extracted from your resume (profile.json ->
  # resume_keywords.job_titles), added as tier-3 queries
  use_profile_titles: false

# Job summaries -- during `enrich`, each job description is turned into a small
# keyword summary (required skills, experience, responsibilities, ATS keywords).
# Scoring, tailoring and cover letters send the summary to the LLM instead of
# the full description (much smaller prompts).
job_summary:
  enabled: true
  store_full_description: true   # false = delete the full text once summarized

# Scoring
scoring:
  # Score jobs 1 without an LLM call when fewer than this many of their required
  # skills match your skills (profile skills + resume keywords). 0 = off.
  min_skill_match: 0

# JobSpy source boards (all available options shown)
boards:
  - indeed
  - linkedin
  - glassdoor
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 24          # Only jobs posted within this many hours

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
